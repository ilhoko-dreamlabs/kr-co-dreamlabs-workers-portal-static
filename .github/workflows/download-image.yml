name: Publish Worker download server image

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character main commit to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable main source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "${#SOURCE_SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main
      - name: Validate source
        run: |
          npm ci
          npm run check
      - name: Sign in to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Build and publish exact image
        id: image
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          image="ghcr.io/ilhoko-dreamlabs/workers-portal-download:${SOURCE_SHA}"
          docker build --file server/Dockerfile \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --tag "$image" .
          docker push "$image"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$image")"
          test -n "$digest"
          echo "image=$digest" >> "$GITHUB_OUTPUT"
          printf 'Published `%s`\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
