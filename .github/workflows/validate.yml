name: Validate static Worker Portal

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install locked tooling
        run: npm ci
      - name: Validate source
        run: npm run check
      - name: Build deterministic artifact
        run: npm run build
      - name: Validate artifact
        run: npm run check:dist
      - name: Build isolated download server image
        run: docker build --file server/Dockerfile --tag worker-portal-download:${{ github.sha }} .
      - name: Upload validation artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-portal-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
