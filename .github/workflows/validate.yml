name: Validate static Worker Portal

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install locked tooling
        run: npm ci
      - name: Validate source
        run: npm run check
      - name: Build deterministic artifact
        run: npm run build
      - name: Stage exact password-protected Portable ZIP
        shell: bash
        run: |
          mkdir -p dist/downloads
          curl --fail --location --retry 3 \
            --output dist/downloads/DreamLabs-Worker-2026.10.20-portable-preview.2-win32-x64-protected.zip \
            https://github.com/ilhoko-dreamlabs/kr-co-dreamlabs-workers-portal-static/releases/download/worker-portable-2026.10.20-preview.2/DreamLabs-Worker-2026.10.20-portable-preview.2-win32-x64-protected.zip
          echo "d415b1767cc5f9825b874c0ca383713f6cd4b5d223b29c4cec4e42bc531eadb9  dist/downloads/DreamLabs-Worker-2026.10.20-portable-preview.2-win32-x64-protected.zip" | sha256sum --check
      - name: Validate artifact
        run: npm run check:dist
      - name: Build isolated download server image
        run: docker build --file server/Dockerfile --tag worker-portal-download:${{ github.sha }} .
      - name: Upload validation artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-portal-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
